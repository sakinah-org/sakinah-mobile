name: sakinah
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartz: ^0.10.1


  #==================================== Network
  dio: ^5.7.0
  url_launcher: ^6.3.1
  either_dart: ^1.0.0
  #==================================== Device Resources
  hive_flutter: ^1.1.0
  open_file: ^3.5.10
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  mime: ^2.0.0
  file_picker: ^10.3.3
  flutter_dotenv: ^6.0.0
  geolocator: ^13.0.2
  share_plus: ^10.1.4
  #==================================== Calendar
  hijri: ^3.0.0
  #==================================== Security
  encrypt: ^5.0.3
  #==================================== UI
  intl: ^0.20.2
  mocktail: ^1.0.4
  qr_flutter: ^4.1.0
  dotted_line: ^3.2.3
  flutter_bloc: ^9.1.0
  video_player: ^2.9.2
  flutter_html: ^3.0.0
  flutter_svg: ^2.0.16
  hydrated_bloc: ^10.0.0
  table_calendar: ^3.1.3
  country_picker: ^2.0.27
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  currency_picker: ^2.0.21
  shimmer_animation: ^2.2.2
  country_code_picker: ^3.3.0
  cached_network_image: ^3.4.1
  calendar_date_picker2: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  supabase_flutter: ^2.17.1
  pinput: ^6.0.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  logger: ^2.5.0
  bloc_test: ^10.0.0
  path_provider_platform_interface: ^2.1.3


flutter:

  uses-material-design: true

  assets:
   - assets/lang/ar.json
   - assets/lang/en.json
   - assets/images/
   - assets/icons/
   - assets/env/
   - assets/quran/chapters/
   - assets/quran/juz_boundaries.json


 
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/w200.ttf
          weight: 200
        - asset: assets/fonts/tajawal/w300.ttf
          weight: 300
        - asset: assets/fonts/tajawal/w400.ttf
          weight: 400
        - asset: assets/fonts/tajawal/w500.ttf
          weight: 500
        - asset: assets/fonts/tajawal/w700.ttf
          weight: 700
        - asset: assets/fonts/tajawal/w800.ttf
          weight: 800
        - asset: assets/fonts/tajawal/w900.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/w400.ttf
    - family: Kitab
      fonts:
        - asset: assets/fonts/kitab/w400.ttf
        - asset: assets/fonts/kitab/w700.ttf
    - family: MeQuran
      fonts:
        - asset: assets/fonts/me_quran/w400.ttf
    - family: QPCHafs
      fonts:
        - asset: assets/fonts/qpc_hafs/w400.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/lateef/w200.ttf
          weight: 200
        - asset: assets/fonts/lateef/w300.ttf
          weight: 300
        - asset: assets/fonts/lateef/w400.ttf
          weight: 400
        - asset: assets/fonts/lateef/w500.ttf
          weight: 500
        - asset: assets/fonts/lateef/w600.ttf
          weight: 600
        - asset: assets/fonts/lateef/w700.ttf
          weight: 700
        - asset: assets/fonts/lateef/w800.ttf
          weight: 800
